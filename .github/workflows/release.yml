name: Release (manual)

# Satu-satunya workflow: hanya jalan via Run workflow manual.
# Pilih bump (major/minor/patch) → verify → buat tag → build CLI+Docker → GitHub Release → npm publish.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump dari tag v* terakhir'
        required: true
        default: 'minor'
        type: choice
        options: [major, minor, patch]

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Verify (vet → test → build, gagal = stop)
        run: |
          set -o pipefail
          mkdir -p logs
          go vet ./... 2>&1 | tee logs/vet.logs
          go test ./... 2>&1 | tee logs/test.logs
          go build -v -o /dev/null ./... 2>&1 | tee logs/build.logs
          node --check npm/bin/puru.js 2>&1 | tee logs/npm-bin.logs
          node --check npm/scripts/install.js 2>&1 | tee logs/npm-install.logs
          node --check npm/scripts/binary.js 2>&1 | tee logs/npm-binary.logs
          cat logs/*.logs > logs/latest_all.logs
          grep -E "^--- FAIL|^FAIL|exit status [1-9]|: error:|: fatal:" logs/latest_all.logs > logs/latest_error.logs || true
          [ -s logs/latest_error.logs ] || echo "(no logs)" > logs/latest_error.logs
          grep -i "warn" logs/latest_all.logs | grep -v "PASS" > logs/latest_warn.logs || true
          [ -s logs/latest_warn.logs ] || echo "(no logs)" > logs/latest_warn.logs

      - name: Push logs to info branch
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir ../temp_logs
          cp logs/*.logs ../temp_logs/
          git fetch origin info || true
          if git rev-parse --verify origin/info >/dev/null 2>&1; then
            git checkout info
            git reset --hard origin/info
          else
            git checkout --orphan info
            git rm -rf .
          fi
          mv ../temp_logs/*.logs .
          git add *.logs
          git commit -m "Update logs: ${GITHUB_SHA:0:7}" || exit 0
          git push origin info --force

  tag:
    needs: verify
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Bump version & push tag
        id: bump
        run: |
          git fetch --tags origin
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          [ -z "$latest" ] && latest=v0.0.0
          echo "Tag terakhir: $latest (bump: ${{ inputs.bump }})"
          ver=${latest#v}
          IFS=. read -r major minor patch <<< "$ver"
          case "${{ inputs.bump }}" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          TAG="v$major.$minor.$patch"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG sudah ada, batal."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Tag baru: $TAG"

  build-binaries:
    needs: tag
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          # Termux Android 32-bit (armv7) — Node lapor arch 'arm'.
          - goos: linux
            goarch: arm
            goarm: '7'
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      # CLI npm-friendly: cmd/puru tanpa web server (puru setup / gateway / chat).
      # Version disuntik via ldflags agar `puru --version` = tag.
      - name: Build puru CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
        run: |
          TAG="${{ needs.tag.outputs.tag }}"
          OUT="puru-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then OUT="$OUT.exe"; fi
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=$TAG" -o "dist/$OUT" ./cmd/puru
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: puru-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  docker:
    needs: tag
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/puru-ai:latest
            ghcr.io/${{ github.repository_owner }}/puru-ai:${{ needs.tag.outputs.tag }}
          labels: org.opencontainers.image.version=${{ needs.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    needs: [tag, docker, build-binaries]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v7
        with:
          pattern: puru-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          (cd dist && sha256sum * > checksums.txt)
          ls -lh dist/

      - name: Create GitHub Release + upload binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.tag.outputs.tag }}"
          gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber

  npm-publish:
    needs: [tag, github-release]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Samakan versi npm dengan tag (tanpa prefix v) agar install.js
      # download asset yang benar secara default.
      - name: Sync npm version with tag
        run: |
          TAG="${{ needs.tag.outputs.tag }}"
          VER="${TAG#v}"
          node -e "const fs=require('fs');const p='npm/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version='$VER';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          node -p "require('./npm/package.json').version"

      - name: Publish @rikipurpur/puru-ai
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN belum di-set — skip publish."
            echo "Tambahkan secret NPM_TOKEN (npm access token untuk user rikipurpur), lalu re-run job ini."
            exit 0
          fi
          npm publish --access public
