name: CI & Logs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Verification
        run: |
          mkdir -p logs
          echo "=== RUNNING VERIFICATION ===" > logs/latest_all.logs
          
          echo "--- GO VET ---" >> logs/latest_all.logs
          go vet ./... 2>&1 | tee -a logs/latest_all.logs || true
          
          echo -e "\n--- GO TEST ---" >> logs/latest_all.logs
          go test -v ./... 2>&1 | tee -a logs/latest_all.logs || true
          
          echo -e "\n--- GO BUILD ---" >> logs/latest_all.logs
          go build -v -o /dev/null ./... 2>&1 | tee -a logs/latest_all.logs || true
          
          # Extract actual failures and compilation errors
          grep -E "^--- FAIL|^FAIL|exit status [1-9]|: error:|: fatal:" logs/latest_all.logs > logs/latest_error.logs || true
          [ -s logs/latest_error.logs ] || echo "(no logs)" > logs/latest_error.logs
          
          grep -i "warn" logs/latest_all.logs | grep -v "PASS" > logs/latest_warn.logs || true
          [ -s logs/latest_warn.logs ] || echo "(no logs)" > logs/latest_warn.logs

      - name: Push Logs to info branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Save logs to temp location
          mkdir ../temp_logs
          cp logs/*.logs ../temp_logs/
          
          # Switch to info branch (create if doesn't exist)
          git fetch origin info || true
          if git rev-parse --verify origin/info >/dev/null 2>&1; then
            git checkout info
            git reset --hard origin/info
          else
            git checkout --orphan info
            git rm -rf .
          fi
          
          # Replace logs
          mv ../temp_logs/*.logs .
          git add *.logs
          git commit -m "Update logs: ${GITHUB_SHA:0:7}" || exit 0
          git push origin info --force
