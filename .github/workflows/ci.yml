name: CI

# Verify-only: runs on every push (and PR). No tags, no release, no publish.
# Any failing step stops the job.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o /dev/null ./...

      - name: Check npm scripts
        run: |
          node --check npm/bin/puru.js
          node --check npm/scripts/install.js
          node --check npm/scripts/binary.js

  # Debug helper: renders one representative system prompt via
  # cmd/dump-prompt, uploads it as the SYSTEMPROMPT artifact, and pushes
  # it to the debug-systemprompt branch so it can be inspected without
  # a local Go toolchain.
  dump-prompt:
    runs-on: ubuntu-24.04
    concurrency:
      group: dump-prompt-debug-systemprompt
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Build system prompt dump
        run: go run ./cmd/dump-prompt --out SYSTEMPROMPT.md

      - name: Show summary
        run: |
          wc -c SYSTEMPROMPT.md
          grep -c '^' SYSTEMPROMPT.md
          head -n 60 SYSTEMPROMPT.md

      - name: Upload SYSTEMPROMPT.md
        uses: actions/upload-artifact@v5
        with:
          name: SYSTEMPROMPT
          path: SYSTEMPROMPT.md
          if-no-files-found: error

      - name: Push to debug-systemprompt branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/promptdump
          cp "$GITHUB_WORKSPACE/SYSTEMPROMPT.md" /tmp/promptdump/SYSTEMPROMPT.md
          rm -f "$GITHUB_WORKSPACE/SYSTEMPROMPT.md"
          for i in 1 2 3 4 5; do
            git fetch origin debug-systemprompt || true
            if git rev-parse --verify origin/debug-systemprompt >/dev/null 2>&1; then
              git checkout -B debug-systemprompt origin/debug-systemprompt
            else
              git checkout --orphan debug-systemprompt
              git rm -rf . || true
            fi
            cp /tmp/promptdump/SYSTEMPROMPT.md ./SYSTEMPROMPT.md
            git add SYSTEMPROMPT.md
            git commit -m "Update SYSTEMPROMPT.md from ${GITHUB_SHA:0:7}" || break
            if git push origin debug-systemprompt; then
              break
            fi
            echo "push race, retry $i..."
            sleep 5
          done

  # Debug helper: runs representative tool calls via cmd/dump-tools,
  # uploads per-tool markdowns (e.g. read_file-output.md) as artifacts,
  # and pushes them to the debug-output-tools branch.
  dump-tools:
    runs-on: ubuntu-24.04
    concurrency:
      group: dump-tools-debug-output-tools
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Build tools dump
        run: go run ./cmd/dump-tools --out tool-dump

      - name: Show summary
        run: |
          ls -l tool-dump
          head -n 40 tool-dump/read_file-output.md

      - name: Upload tool dumps
        uses: actions/upload-artifact@v5
        with:
          name: TOOL-DUMP
          path: tool-dump/*.md
          if-no-files-found: error

      - name: Push to debug-output-tools branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/tooldump
          cp "$GITHUB_WORKSPACE/tool-dump/"*.md /tmp/tooldump/
          rm -rf "$GITHUB_WORKSPACE/tool-dump"
          for i in 1 2 3 4 5; do
            git fetch origin debug-output-tools || true
            if git rev-parse --verify origin/debug-output-tools >/dev/null 2>&1; then
              git checkout -B debug-output-tools origin/debug-output-tools
            else
              git checkout --orphan debug-output-tools
              git rm -rf . || true
            fi
            cp /tmp/tooldump/*.md ./
            git add *.md
            git commit -m "Update tool outputs from ${GITHUB_SHA:0:7}" || break
            if git push origin debug-output-tools; then
              break
            fi
            echo "push race, retry $i..."
            sleep 5
          done
